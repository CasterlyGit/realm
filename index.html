<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#05030e" />
    <title>Realm — A Sky of Dragons</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Optional hand-gesture control overlay (MediaPipe). Hidden until enabled. -->
    <div id="hand-system">
      <div id="webcam-wrap">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="webcam-overlay"></canvas>
      </div>
      <div id="webcam-info">
        <div id="gesture-label">—</div>
        <div id="webcam-legend">✋ flap · ✊ fire · ✌ pulse</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
