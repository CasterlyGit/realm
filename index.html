<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realm — A Sky of Dragons</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="damage-flash"></div>

    <div id="select-screen">
      <div id="select-title">CHOOSE YOUR DRAGON</div>
      <div id="select-cards"></div>
      <div id="select-hint">click a dragon to bond · fly to begin</div>
    </div>

    <div id="hud">
      <div id="title">
        <div class="title-name">Eira of Aelric.</div>
        <div class="title-sub">For the cart.</div>
      </div>
      <div id="hint">
        <b>W/S</b> pitch · <b>A/D</b> turn · <b>Q/E</b> roll ·
        <b>Space</b> flap · <b>Shift</b> sprint · <b>LMB/F</b> fire ·
        <b>R</b> signature skill
      </div>

      <div id="bars">
        <div class="bar" id="hp-bar">
          <div class="bar-label">VIGOR</div>
          <div class="bar-track"><div class="bar-fill" id="hp-fill"></div></div>
        </div>
        <div class="bar" id="heat-bar">
          <div class="bar-label">FLAME</div>
          <div class="bar-track"><div class="bar-fill heat" id="heat-fill"></div></div>
        </div>
      </div>

      <div id="top-hud">
        <div id="wave-indicator">WAVE 1 / 3</div>
        <div id="score-block">
          <div id="score">0</div>
          <div id="combo"></div>
        </div>
      </div>

      <div id="wave-banner"></div>

      <div id="enemy-hp">
        <div class="bar-label">VEIL · SKARN OF HOUSE CALDEN</div>
        <div class="bar-track"><div class="bar-fill enemy" id="enemy-hp-fill"></div></div>
      </div>

      <div id="skill-indicator">
        <div class="skill-key">R</div>
        <div class="skill-info">
          <div id="skill-name">INFERNO</div>
          <div class="skill-cd-track"><div id="skill-cd-fill"></div></div>
        </div>
      </div>

      <div id="reticle">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <circle cx="20" cy="20" r="14" fill="none" stroke="rgba(255,220,180,0.5)" stroke-width="1"/>
          <line x1="20" y1="2" x2="20" y2="9" stroke="rgba(255,220,180,0.6)" stroke-width="1"/>
          <line x1="20" y1="31" x2="20" y2="38" stroke="rgba(255,220,180,0.6)" stroke-width="1"/>
          <line x1="2" y1="20" x2="9" y2="20" stroke="rgba(255,220,180,0.6)" stroke-width="1"/>
          <line x1="31" y1="20" x2="38" y2="20" stroke="rgba(255,220,180,0.6)" stroke-width="1"/>
          <circle cx="20" cy="20" r="1.5" fill="rgba(255,180,120,0.9)"/>
        </svg>
      </div>
    </div>

    <div id="endcard">
      <div class="end-text">THE SKY IS YOURS</div>
      <div class="end-sub">Press R to fly again</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
